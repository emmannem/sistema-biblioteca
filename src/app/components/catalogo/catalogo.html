<div class="card p-4">
  <h3>Catálogo</h3>

  <table class="table table-striped">
    <tr>
      <th>Libro</th>
    </tr>

    @for (libro of biblioteca.catalogo; track libro) {
      <tr>
        <td>{{ libro }}</td>
      </tr>
    } @empty {
      <tr>
        <td>No hay libros disponibles en este momento.</td>
      </tr>
    }
  </table>
</div>
